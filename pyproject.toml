[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-prioris"
version = "0.1.0"
description = "Python client library for AXIS real-time information delivery service by Prioris"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "mugicomugi" },
]
keywords = ["axis", "prioris", "earthquake", "jma", "websocket", "eew"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# NOTE: Run `pip-audit` regularly in CI to detect known vulnerabilities
# in transitive dependencies.
dependencies = [
    "websocket-client>=1.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/mugicomugi/axis.py"

[tool.setuptools.packages.find]
include = ["axis*"]
